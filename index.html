<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonzai Bros.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shojumaru&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000000;
            color: #5ce1e6;           /* Türkis/Cyan */
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Fixed Top Container */
        .fixed-header-container {
            position: sticky;
            top: 0;
            background-color: #000000;
            z-index: 1000;
            padding-bottom: 1px;
        }

        /* Header Section */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0px;
            padding-top: 10px;
        }
        
        .logo-img {
            width: 300px;
            height: auto;
            object-fit: contain;
        }

        .title-container {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            flex-grow: 1;
            margin-left: 20px;
        }

        /* Banner Image */
        .banner-img {
            max-width: 150%;
            height: auto;
            max-height: 150px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        
        /* Navigation Bar */
        nav {
            position: relative;
            width: 100%;
            background: #0d1b2a;
            border: 2px solid #5ce1e6;
            border-radius: 8px;
            padding: 8px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: inset 0 0 10px rgba(92, 225, 230, 0.2), 0 4px 6px rgba(0,0,0,0.5);
        }

        nav::before, nav::after {
            content: '';
            position: absolute;
            left: -10px;
            right: -10px;
            height: 2px;
            background: #5ce1e6;
        }
        nav::before { top: -6px; }
        nav::after { bottom: -6px; }

        .nav-button {
            background: none;
            border: none;
            font-family: 'Arial Black', sans-serif;
            font-size: 24px;
            color: #5ce1e6;
            text-shadow: 1px 1px 0px #000, 0 0 5px rgba(92, 225, 230, 0.5);
            cursor: pointer;
            transition: transform 0.1s, color 0.1s;
        }

        .nav-button:hover, .nav-button.active {
            color: #ffffff;
            text-shadow: 0 0 8px #5ce1e6, 0 0 12px #5ce1e6;
            transform: scale(1.05);
        }

        /* Main Content */
        main {
            padding-top: 0px;
        }

        /* Tab Visibility */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* News Layout (Jetzt wie Releases im 3-Spalten-Grid) */
        .news-item {
            display: grid;
            grid-template-columns: 220px 1fr 220px;
            gap: 20px;
            align-items: start;
            margin-bottom: 0px;
        }

        .news-title {
            font-size: 16px;
            font-weight: bold;
            color: #5ce1e6;
            text-shadow: 0 0 3px rgba(92, 225, 230, 0.4);
        }

        .news-text {
            font-size: 16px;
            line-height: 1.5;
            color: #5ce1e6;
        }

        .news-links {
            list-style: none;
        }

        .news-links li {
            margin-bottom: 4px;
            text-align: right;
        }

        .news-links a {
            color: #5ce1e6;
            font-size: 16px;
            text-decoration: underline;
        }

        .news-links a:hover {
            color: #ffffff;
            text-shadow: 0 0 5px #5ce1e6;
        }

        .news-links a:visited {
            color: #ff2a6d;
        }

        /* Releases Layout */
        .release-item {
            display: grid;
            grid-template-columns: 220px 1fr 220px;
            gap: 20px;
            align-items: start;
        }

        .release-title {
            font-size: 16px;
            font-weight: bold;
            color: #5ce1e6;
            text-shadow: 0 0 3px rgba(92, 225, 230, 0.4);
        }
